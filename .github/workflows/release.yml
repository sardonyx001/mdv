name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # required for cosign keyless signing + npm trusted publishing

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - run: bun install
      - run: bun build index.ts --compile --outfile mdv-${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mdv-${{ matrix.target }}
          path: mdv-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          merge-multiple: true

      - name: Sign binaries with cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - run: |
          for bin in mdv-*; do
            cosign sign-blob --yes "$bin" --bundle "${bin}.bundle"
          done

      - name: Generate changelog fragment
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4.8.0
        with:
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            mdv-*
            *.bundle
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

      - name: Publish to npm
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      - run: bun install

      - run: bun publish --access public

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          ARM_SHA=$(shasum -a 256 mdv-aarch64-apple-darwin | awk '{print $1}')
          LINUX_X86_SHA=$(shasum -a 256 mdv-x86_64-unknown-linux-gnu | awk '{print $1}')
          LINUX_ARM_SHA=$(shasum -a 256 mdv-aarch64-unknown-linux-gnu | awk '{print $1}')
          REPO="sardonyx001/homebrew-tap"
          FORMULA_PATH="Formula/mdv.rb"
          cat > /tmp/mdv.rb << EOF
          class Mdv < Formula
            desc "Minimal CLI markdown viewer with GitHub-accurate rendering and file tree sidebar"
            homepage "https://github.com/sardonyx001/mdv"
            version "${VERSION#v}"
            license "MIT"

            on_macos do
              url "https://github.com/sardonyx001/mdv/releases/download/${VERSION}/mdv-aarch64-apple-darwin"
              sha256 "${ARM_SHA}"
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/sardonyx001/mdv/releases/download/${VERSION}/mdv-aarch64-unknown-linux-gnu"
                sha256 "${LINUX_ARM_SHA}"
              else
                url "https://github.com/sardonyx001/mdv/releases/download/${VERSION}/mdv-x86_64-unknown-linux-gnu"
                sha256 "${LINUX_X86_SHA}"
              end
            end

            def install
              bin.install Dir["mdv-*"].first => "mdv"
            end

            test do
              assert_match "usage", shell_output("#{bin}/mdv 2>&1", 1)
            end
          end
          EOF
          ENCODED=$(base64 -w0 /tmp/mdv.rb)
          CURRENT_SHA=$(gh api "repos/${REPO}/contents/${FORMULA_PATH}" --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$CURRENT_SHA" ]; then
            gh api "repos/${REPO}/contents/${FORMULA_PATH}" --method PUT \
              --field message="chore: update mdv to ${VERSION}" \
              --field content="${ENCODED}" \
              --field sha="${CURRENT_SHA}"
          else
            gh api "repos/${REPO}/contents/${FORMULA_PATH}" --method PUT \
              --field message="chore: add mdv formula ${VERSION}" \
              --field content="${ENCODED}"
          fi
