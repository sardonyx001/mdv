name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun build index.ts --compile --outfile mdv
      - uses: actions/upload-artifact@v4
        with:
          name: mdv-macos
          path: mdv
