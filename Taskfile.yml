version: '3'

tasks:
  build:
    cmds:
      - bun build index.ts --compile --outfile mdv

  install:
    deps: [build]
    cmds:
      - cp mdv ~/.local/bin/mdv
      - xattr -d com.apple.quarantine ~/.local/bin/mdv 2>/dev/null || true
      - codesign -s - ~/.local/bin/mdv

  hooks:
    desc: Install git hooks via lefthook (run once after cloning)
    cmds:
      - lefthook install

  release:
    desc: Generate changelog, tag next semver, and push
    cmds:
      - git fetch --tags --quiet
      - |
        NEXT=$(svu next)
        echo "Current: $(svu current)"
        echo "Next:    $NEXT"
        bun pm version "${NEXT#v}" --no-git-tag-version
        git-cliff --tag "$NEXT" --output CHANGELOG.md
        git add CHANGELOG.md package.json
        git commit -m "chore(release): bump version to $NEXT" --no-verify
        git tag -a "$NEXT" -m "Release $NEXT"
        git push origin main --follow-tags
        echo "✓ Released $NEXT"

  default:
    aliases: [all]
    deps: [install]
